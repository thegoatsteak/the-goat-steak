<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202719"><title>THE GOAT STEAK | المنيو</title>
<style>
:root{--olive:#202719;--olive2:#303827;--cream:#f2e9d3;--muted:#c8c0a8;--line:#777b5b}
*{box-sizing:border-box}body{margin:0;background:var(--olive);color:var(--cream);font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 16px 28px}header{text-align:center;padding:28px 12px 22px}
.brand{font-family:Georgia,serif;letter-spacing:3px;font-size:clamp(28px,7vw,44px);font-weight:bold;direction:ltr}
.tag{color:var(--muted);font:11px Georgia,serif;letter-spacing:3px;margin-top:8px;direction:ltr}
.rule{height:1px;background:var(--line);margin:18px 0}h1{text-align:center;font-size:25px;margin:20px 0 8px}
.intro{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px}
.tabs{display:flex;gap:8px;justify-content:center;margin:0 0 22px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:30px;padding:10px 22px;font-size:14px;cursor:pointer}
.tabs button.active{background:var(--cream);color:var(--olive);border-color:var(--cream)}
h2{font-size:19px;margin:26px 4px 14px}.card{background:var(--olive2);border:1px solid #f2e9d314;border-radius:18px;padding:16px;margin:12px 0 16px}
.food-img{width:100%;height:190px;object-fit:cover;border-radius:12px;background:linear-gradient(135deg,#4c5038,#202719 70%);margin-bottom:14px}
.itemtop{display:flex;justify-content:space-between;align-items:center;gap:12px;direction:ltr}
.itemtop h3{font: bold 19px Georgia,serif;margin:0;letter-spacing:1px}.price{font-size:17px;color:#e9d8b6;white-space:nowrap;direction:ltr}
.desc{font-size:13px;line-height:1.9;color:#e1dccf;margin:12px 0 0}
footer{text-align:center;padding:14px 8px 8px}.contact{display:flex;flex-direction:column;gap:12px;align-items:center}
.contact a{color:var(--cream);text-decoration:none;border:1px solid var(--line);border-radius:30px;padding:11px 18px;min-width:230px;font-size:14px}
.small{font-size:11px;color:var(--muted);margin-top:22px}.hidden{display:none!important}
@media(min-width:600px){.food-img{height:220px}.card{padding:20px}}
</style></head>
<body><main class="wrap">
<header><div class="brand" id="brand">THE GOAT STEAK</div><div class="tag" id="tagline">STEAK • FLAVOR • EXPERIENCE</div><div class="rule"></div><h1 id="menuTitle">قائمة الطعام</h1><p class="intro" id="intro">اختر وجبتك واستمتع بالتجربة</p></header>
<nav class="tabs"><button class="active" data-filter="all">الكل</button><button data-filter="food">الوجبات</button><button data-filter="drink">المشروبات</button></nav>
<div id="menu"></div>
<footer><div class="rule"></div><div class="brand" id="footerBrand" style="font-size:25px">THE GOAT STEAK</div><h2>تواصل معنا</h2><div class="contact" id="contact"></div><p class="small">شكراً لاختياركم THE GOAT STEAK</p></footer>
</main>
<script>
let currentFilter='all',menuData;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 document.getElementById('brand').textContent=menuData.brand;document.getElementById('footerBrand').textContent=menuData.brand;
 document.getElementById('tagline').textContent=menuData.tagline;document.getElementById('menuTitle').textContent=menuData.menuTitle;document.getElementById('intro').textContent=menuData.intro;
 const groups=[['food','الوجبات الرئيسية'],['drink','المشروبات']];
 document.getElementById('menu').innerHTML=groups.filter(([k])=>currentFilter==='all'||currentFilter===k).map(([k,title])=>{
  const items=(menuData.items||[]).filter(x=>x.category===k);
  return items.length?`<section><h2>${title}</h2>${items.map(x=>`<article class="card">${x.image?`<img class="food-img" src="${esc(x.image)}" alt="${esc(x.name)}">`:`<div class="food-img"></div>`}<div class="itemtop"><h3>${esc(x.name)}</h3><strong class="price">${esc(x.price)} SAR</strong></div><p class="desc">${esc(x.description)}</p></article>`).join('')}</section>`:'';
 }).join('');
 const phone=String(menuData.phone||'').replace(/\D/g,'');const wa=String(menuData.whatsapp||'').replace(/\D/g,'');
 document.getElementById('contact').innerHTML=`<a href="tel:${phone}">☎　${esc(menuData.phone)}</a><a href="https://wa.me/${wa}" target="_blank" rel="noopener">واتساب　${esc(menuData.phone)}</a><a href="${esc(menuData.tiktok)}" target="_blank" rel="noopener">TikTok　@the.goat.steak</a>`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()}));
fetch('./data/menu.json').then(r=>{if(!r.ok)throw Error('menu');return r.json()}).then(d=>{menuData=d;render()}).catch(()=>{document.getElementById('menu').textContent='تعذر تحميل المنيو حالياً.'});
</script></body></html>
